{% extends 'base.html' %}
{% block title %}Delete Student{% endblock %}
{% block content %}
<div class="mx-auto max-w-md rounded-xl border border-line bg-white/60 p-6 text-center">
  <h1 class="font-serif text-2xl font-bold">Delete this student?</h1>
  <p class="mt-2 text-sm text-muted">
    <span class="font-medium text-ink">{{ student.full_name }}</span> ({{ student.student_id }}) and their
    background and guardian records will be permanently removed.
  </p>
  <form method="post" class="mt-6 flex justify-center gap-3">
    {% csrf_token %}
    <button type="submit" class="rounded-lg bg-red-600 px-6 py-2.5 text-sm font-medium text-white transition hover:bg-red-700">Yes, delete</button>
    <a href="{% url 'students:detail' student.pk %}" class="rounded-lg border border-line bg-white/60 px-6 py-2.5 text-sm transition hover:bg-white">Cancel</a>
  </form>
</div>
{% endblock %}
