{% if student.status == 'enrolled' %}
  <span class="rounded-full bg-green-100 px-2.5 py-0.5 text-xs font-semibold text-green-800">{{ student.get_status_display }}</span>
{% elif student.status == 'pending' %}
  <span class="rounded-full bg-yellow-100 px-2.5 py-0.5 text-xs font-semibold text-yellow-800">{{ student.get_status_display }}</span>
{% else %}
  <span class="rounded-full bg-red-100 px-2.5 py-0.5 text-xs font-semibold text-red-800">{{ student.get_status_display }}</span>
{% endif %}
