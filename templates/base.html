{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Online Enrollment{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="min-h-screen bg-cream font-sans text-ink">
  <header class="bg-navy px-6 py-3.5 font-serif text-lg font-bold text-white">Online Enrollment System</header>
  <main class="mx-auto my-8 max-w-4xl px-4">
    {% for message in messages %}
        <div class="mb-4 rounded-lg bg-green-100 px-4 py-2 text-sm text-green-800">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
